# Valkey config shared by local dev and production.
# One instance serves two roles, split by logical database:
#   db 0  Celery broker   (queue keys have no TTL and must never be evicted)
#   db 1  Django cache    (every key has a TTL and may be evicted)
# The password is passed with --requirepass at startup so it never lives in this file.

# Persistence: append-only file so queued tasks survive a restart.
appendonly yes
appendfsync everysec

# Memory: evict only keys that have a TTL (cache entries), never the Celery queues.
# Raise maxmemory on the VPS as traffic grows; keep it below the container memory limit.
maxmemory 256mb
maxmemory-policy volatile-lru

# Connections
timeout 300
tcp-keepalive 60

# Disable commands that can wipe or reconfigure the instance from a client.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
