# Local development services. Run from the repo root:
#   docker compose -f infra/docker-compose.yml up -d
# Host ports default to 5442/6382 to avoid clashing with local services; override with
# POSTGRES_PORT / VALKEY_PORT (and update the matching URLs in backend/.env).
name: senkaihub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: senkaihub
      POSTGRES_USER: senkaihub
      POSTGRES_PASSWORD: senkaihub
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senkaihub -d senkaihub"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.2.1-alpine
    command: >-
      valkey-server /usr/local/etc/valkey/valkey.conf
      --requirepass ${VALKEY_PASSWORD:-senkaihub}
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-senkaihub}
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6382}:6379"
    volumes:
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
  valkey-data:
