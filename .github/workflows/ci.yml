name: CI Checks

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type Check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: pnpm lint

      - name: Production Build
        working-directory: frontend
        run: pnpm run build --webpack

  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: senkaihub
          POSTGRES_USER: senkaihub
          POSTGRES_PASSWORD: senkaihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U senkaihub"
          --health-interval 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgres://senkaihub:senkaihub@localhost:5432/senkaihub
      # Tests use an in-memory cache and eager Celery, so no Valkey service is needed.
      VALKEY_BROKER_URL: redis://localhost:6379/0
      VALKEY_CACHE_URL: redis://localhost:6379/1

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements/*.txt"

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest -q
